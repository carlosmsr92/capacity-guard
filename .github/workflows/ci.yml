name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {python: "3.12", deps: "-r requirements.lock"}   # entorno exacto de Docker
          - {python: "3.11", deps: "-r requirements.txt"}    # últimas versiones compatibles
          - {python: "3.13", deps: "-r requirements.txt"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install ${{ matrix.deps }} pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m capguard all --bench-seeds 0 --out outputs
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: {name: informe, path: "outputs/report.html"}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t capacity-guard .
      - name: El contenedor arranca y el dashboard responde
        run: |
          docker run -d --name cg -p 8501:8501 capacity-guard
          for i in $(seq 1 30); do curl -fs http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs cg; exit 1
